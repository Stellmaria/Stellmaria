<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190" role="img" aria-label="Stellmaria animated introduction">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080914"/><stop offset=".5" stop-color="#100d1d"/><stop offset="1" stop-color="#1b1027"/></linearGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#d8b4fe"/><stop offset=".5" stop-color="#9a83f5"/><stop offset="1" stop-color="#efa5d1"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="918" height="188" rx="28" fill="url(#bg)" stroke="#39294d"/>
<circle cx="64" cy="39" r="2" fill="#d5b4ff"><animate attributeName="opacity" values=".25;1;.25" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="858" cy="43" r="1.5" fill="#efa5d1"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></circle>
<text x="460" y="61" text-anchor="middle" fill="#f5efff" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">Stellmaria</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" text-anchor="middle">
  <text x="460" y="104" fill="#d8c8ea" opacity="1">Java Backend Developer<animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.22;.3;.36;.55;.63;.82;.9;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="460" y="104" fill="#d8c8ea" opacity="0">systems · data · infrastructure · automation<animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;.25;.34;.55;.64;.7;.84;.94;1" dur="12s" repeatCount="indefinite"/></text>
  <text x="460" y="104" fill="#d8c8ea" opacity="0">building resilient systems after dark<animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;.28;.45;.58;.67;.84;.92;.97;1" dur="12s" repeatCount="indefinite"/></text>
</g>
<rect x="619" y="92" width="7" height="17" rx="1.5" fill="#d8b4fe"><animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/></rect>
<text x="460" y="137" text-anchor="middle" fill="#8f829f" font-family="Inter,Segoe UI,sans-serif" font-size="11">clean boundaries · calm interfaces · deliberate delivery</text>
<rect x="104" y="163" width="712" height="2" rx="1" fill="url(#accent)" opacity=".55" filter="url(#glow)">
  <animate attributeName="x" values="104;154;104" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="width" values="712;612;712" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>
