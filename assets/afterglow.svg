<svg xmlns="http://www.w3.org/2000/svg" width="920" height="120" viewBox="0 0 920 120" role="img" aria-label="Animated profile signal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080914"/><stop offset=".5" stop-color="#100d1d"/><stop offset="1" stop-color="#1b1027"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#d8b4fe"/><stop offset=".5" stop-color="#8f7cf7"/><stop offset="1" stop-color="#efa5d1"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="918" height="118" rx="26" fill="url(#bg)" stroke="#39294d"/>

  <circle cx="70" cy="33" r="1.7" fill="#d8b4fe"><animate attributeName="opacity" values=".18;1;.18" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="845" cy="36" r="1.5" fill="#efa5d1"><animate attributeName="opacity" values="1;.18;1" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="111" cy="87" r="1.3" fill="#9a83f5"><animate attributeName="opacity" values=".12;.85;.12" dur="4.8s" begin=".6s" repeatCount="indefinite"/></circle>
  <circle cx="807" cy="84" r="1.3" fill="#f0a9d4"><animate attributeName="opacity" values=".85;.12;.85" dur="4.8s" begin=".6s" repeatCount="indefinite"/></circle>

  <text x="42" y="43" fill="#f6efff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">PROFILE SIGNAL</text>
  <text x="42" y="62" fill="#8f819f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">quiet craft · visible progress</text>
  <circle cx="42" cy="83" r="3" fill="#8f7cf7"><animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></circle>
  <text x="53" y="87" fill="#b9a9c9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9">ACTIVE</text>

  <g text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="460" y="50" fill="#f0e7fb" font-size="13" font-weight="700" opacity="1">CODE · DREAM · CREATE<animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;.24;.31;.37;.58;.66;.84;.92;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="460" y="50" fill="#f0e7fb" font-size="13" font-weight="700" opacity="0">BUILD · VERIFY · SHIP<animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;.25;.33;.55;.64;.71;.84;.93;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="460" y="50" fill="#f0e7fb" font-size="13" font-weight="700" opacity="0">SYSTEMS · DATA · AUTOMATION<animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;.29;.45;.59;.68;.84;.92;.97;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="460" y="73" fill="#8e819b" font-family="Inter,Segoe UI,sans-serif" font-size="10.5">one thoughtful commit at a time</text>
  </g>

  <rect x="76" y="96" width="768" height="2" rx="1" fill="url(#accent)" opacity=".45" filter="url(#glow)">
    <animate attributeName="x" values="76;126;76" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="768;668;768" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
