<svg width="1000" height="500" viewBox="0 0 1000 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="room" x1="80" y1="20" x2="920" y2="480" gradientUnits="userSpaceOnUse">
    <stop stop-color="#090C18"/>
    <stop offset="0.55" stop-color="#151126"/>
    <stop offset="1" stop-color="#25162F"/>
  </linearGradient>
  <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#0B1630"/>
    <stop offset="1" stop-color="#1D1837"/>
  </linearGradient>
  <linearGradient id="desk" x1="180" y1="380" x2="860" y2="450" gradientUnits="userSpaceOnUse">
    <stop stop-color="#281C31"/>
    <stop offset="1" stop-color="#3B2445"/>
  </linearGradient>
  <linearGradient id="fur" x1="410" y1="180" x2="560" y2="380" gradientUnits="userSpaceOnUse">
    <stop stop-color="#2B2931"/>
    <stop offset="1" stop-color="#17171D"/>
  </linearGradient>
  <linearGradient id="furLight" x1="430" y1="190" x2="515" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F2EEF3"/>
    <stop offset="1" stop-color="#BFB8C9"/>
  </linearGradient>
  <linearGradient id="hoodie" x1="410" y1="280" x2="535" y2="400" gradientUnits="userSpaceOnUse">
    <stop stop-color="#46314F"/>
    <stop offset="1" stop-color="#2B2035"/>
  </linearGradient>
  <radialGradient id="lampGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(829 249) rotate(90) scale(155)">
    <stop stop-color="#D69BFF" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#D69BFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="screenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(695 235) rotate(90) scale(175 235)">
    <stop stop-color="#9C7CFF" stop-opacity="0.17"/>
    <stop offset="1" stop-color="#9C7CFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur12" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="windowClip"><rect x="83" y="67" width="270" height="232" rx="12"/></clipPath>
  <style>
    .rain1{animation:rain 2.2s linear infinite}.rain2{animation:rain 2.8s linear .7s infinite}.rain3{animation:rain 2.4s linear 1.3s infinite}.rain4{animation:rain 3s linear .25s infinite}
    .blink{animation:blink 5.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .ear{animation:ear 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
    .tail{animation:tail 3.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:90% 55%}
    .pawL{animation:typeL .58s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .pawR{animation:typeR .52s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .steam1{animation:steam 3.3s ease-out infinite}.steam2{animation:steam 3.3s ease-out 1.5s infinite}
    .cursor{animation:cursor 1s steps(1,end) infinite}
    .code1{animation:code 2.6s ease-in-out infinite}.code2{animation:code 2.6s ease-in-out .5s infinite}.code3{animation:code 2.6s ease-in-out 1s infinite}
    .star{animation:twinkle 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.star2{animation-delay:1s}.star3{animation-delay:2s}
    .lamp{animation:lamp 4s ease-in-out infinite}
    @keyframes rain{0%{transform:translateY(-45px);opacity:0}12%{opacity:.55}100%{transform:translateY(290px);opacity:0}}
    @keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
    @keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-7deg)}96%{transform:rotate(4deg)}}
    @keyframes tail{from{transform:rotate(-4deg)}to{transform:rotate(9deg)}}
    @keyframes typeL{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(6px) rotate(3deg)}}
    @keyframes typeR{from{transform:translateY(5px) rotate(2deg)}to{transform:translateY(0) rotate(-2deg)}}
    @keyframes steam{0%{opacity:0;transform:translateY(9px)}25%{opacity:.55}100%{opacity:0;transform:translateY(-28px)}}
    @keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes code{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:1;transform:scale(1.2)}}
    @keyframes lamp{0%,100%{opacity:.82}50%{opacity:1}}
  </style>
</defs>

<rect width="1000" height="500" rx="28" fill="url(#room)"/>
<rect x="20" y="20" width="960" height="460" rx="22" stroke="#6E527D" stroke-opacity=".22"/>

