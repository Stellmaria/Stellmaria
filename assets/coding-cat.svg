<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="room" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
    <stop stop-color="#090B16"/><stop offset="0.55" stop-color="#121326"/><stop offset="1" stop-color="#24172D"/>
  </linearGradient>
  <linearGradient id="windowSky" x1="0" y1="0" x2="0" y2="260">
    <stop stop-color="#0B1230"/><stop offset="1" stop-color="#312042"/>
  </linearGradient>
  <linearGradient id="desk" x1="270" y1="380" x2="1060" y2="430">
    <stop stop-color="#2B1B31"/><stop offset="1" stop-color="#4B2C45"/>
  </linearGradient>
  <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#171923"/><stop offset="0.55" stop-color="#292836"/><stop offset="1" stop-color="#3B3343"/>
  </linearGradient>
  <linearGradient id="furLight" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#43414F"/><stop offset="1" stop-color="#777081"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0D1524"/><stop offset="1" stop-color="#151127"/>
  </linearGradient>
  <radialGradient id="lampGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(347 281) rotate(90) scale(165 220)">
    <stop stop-color="#E7A4FF" stop-opacity=".28"/><stop offset="1" stop-color="#E7A4FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="screenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(814 255) rotate(90) scale(180 260)">
    <stop stop-color="#7C9CFF" stop-opacity=".22"/><stop offset="1" stop-color="#7C9CFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .rain1{animation:rain 1.7s linear infinite}.rain2{animation:rain 2.1s linear .4s infinite}.rain3{animation:rain 1.9s linear .8s infinite}
    .tail{animation:tail 3.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:12% 75%}
    .ear{animation:ear 5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}
    .paw{animation:type .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .paw2{animation:type .56s ease-in-out .16s infinite alternate;transform-box:fill-box;transform-origin:center}
    .blink{animation:blink 5.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .cursor{animation:cursor .9s steps(1,end) infinite}.steam{animation:steam 3.3s ease-out infinite}.steam2{animation:steam 3.3s ease-out 1.4s infinite}
    .screenline{animation:pulse 2.4s ease-in-out infinite}.screenline2{animation:pulse 2.4s ease-in-out .7s infinite}
    @keyframes rain{0%{transform:translateY(-35px);opacity:0}15%{opacity:.55}100%{transform:translateY(300px);opacity:0}}
    @keyframes tail{from{transform:rotate(-5deg)}to{transform:rotate(8deg)}}
    @keyframes ear{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-8deg)}96%{transform:rotate(5deg)}}
    @keyframes type{from{transform:translateY(0) rotate(0)}to{transform:translateY(4px) rotate(2deg)}}
    @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.07)}}
    @keyframes cursor{0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes steam{0%{opacity:0;transform:translateY(8px)}25%{opacity:.55}100%{opacity:0;transform:translateY(-24px)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</defs>

<rect width="1200" height="500" rx="28" fill="url(#room)"/>
<rect x="48" y="46" width="330" height="264" rx="14" fill="#0A0D1A" stroke="#493458" stroke-width="2"/>
