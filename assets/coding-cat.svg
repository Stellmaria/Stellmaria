<svg width="900" height="420" viewBox="0 0 900 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080A18"/>
      <stop offset="0.55" stop-color="#15112B"/>
      <stop offset="1" stop-color="#241337"/>
    </linearGradient>
    <linearGradient id="desk" x1="100" y1="354" x2="800" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20152C"/>
      <stop offset="1" stop-color="#3A2149"/>
    </linearGradient>
    <linearGradient id="screen" x1="485" y1="95" x2="750" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11152A"/>
      <stop offset="1" stop-color="#17102A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(625 185) rotate(90) scale(175 245)">
      <stop stop-color="#B875FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B875FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .star { animation: twinkle 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.4s; } .s4 { animation-delay: 2.1s; }
      .cursor { animation: blink 1s steps(1,end) infinite; }
      .paw-left { animation: typeL .48s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .paw-right { animation: typeR .52s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .tail { animation: tail 2.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 20% 80%; }
      .ear { animation: ear 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
      .eye { animation: eyeBlink 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .code1 { animation: codePulse 2.2s ease-in-out infinite; }
      .code2 { animation: codePulse 2.2s ease-in-out .35s infinite; }
      .code3 { animation: codePulse 2.2s ease-in-out .7s infinite; }
      .steam1 { animation: steam 3s ease-out infinite; }
      .steam2 { animation: steam 3s ease-out 1.3s infinite; }
      @keyframes twinkle { 0%,100% { opacity:.25; transform:scale(.65) rotate(0deg);} 50% {opacity:1; transform:scale(1.15) rotate(20deg);} }
      @keyframes blink { 0%,48% {opacity:1;} 49%,100% {opacity:0;} }
      @keyframes typeL { from {transform:translateY(0) rotate(0deg);} to {transform:translateY(5px) rotate(4deg);} }
      @keyframes typeR { from {transform:translateY(4px) rotate(-3deg);} to {transform:translateY(0) rotate(2deg);} }
      @keyframes tail { from {transform:rotate(-5deg);} to {transform:rotate(8deg);} }
      @keyframes ear { 0%,91%,100% {transform:rotate(0deg);} 94% {transform:rotate(-7deg);} 97% {transform:rotate(4deg);} }
      @keyframes eyeBlink { 0%,44%,48%,100% {transform:scaleY(1);} 46% {transform:scaleY(.08);} }
      @keyframes codePulse { 0%,100% {opacity:.45;} 50% {opacity:1;} }
      @keyframes steam { 0% {opacity:0; transform:translateY(9px);} 25% {opacity:.6;} 100% {opacity:0; transform:translateY(-20px);} }
    </style>
  </defs>

  <rect width="900" height="420" rx="28" fill="url(#bg)"/>
  <ellipse cx="630" cy="185" rx="250" ry="176" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#EAB8FF" filter="url(#tinyGlow)">
    <path class="star" d="M83 78l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z"/>
    <path class="star s2" d="M177 138l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6z"/>
    <circle class="star s3" cx="274" cy="70" r="3"/>
    <path class="star s4" d="M810 84l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z"/>
    <circle class="star s2" cx="835" cy="200" r="2.5"/>
    <circle class="star" cx="64" cy="235" r="2.2"/>
  </g>

  <!-- moon -->
  <g filter="url(#softGlow)">
    <circle cx="761" cy="72" r="27" fill="#FFD5E8" opacity=".85"/>
    <circle cx="774" cy="62" r="25" fill="#17102A"/>
  </g>

  <!-- title -->
  <text x="76" y="155" fill="#F0D5FF" font-family="Georgia, serif" font-size="64" letter-spacing="1">Stellmaria</text>
  <text x="80" y="190" fill="#AA8BBE" font-family="Verdana, sans-serif" font-size="15" letter-spacing="4">CODE • CATS • MIDNIGHT</text>
  <path d="M79 212H326" stroke="#6F4D83" stroke-width="1"/>
  <circle cx="339" cy="212" r="3" fill="#D5A8F0" class="star s3"/>

  <!-- desk -->
  <path d="M84 347C84 337 92 329 102 329H797C808 329 816 337 816 347V370C816 380 808 388 798 388H103C92 388 84 380 84 370V347Z" fill="url(#desk)"/>
  <path d="M121 388H151L141 420H111L121 388ZM749 388H779L789 420H759L749 388Z" fill="#17101F"/>

  <!-- monitor -->
  <rect x="485" y="91" width="278" height="207" rx="14" fill="#2B1C3A"/>
  <rect x="494" y="100" width="260" height="186" rx="8" fill="url(#screen)"/>
  <circle cx="507" cy="112" r="3" fill="#FF7597"/><circle cx="518" cy="112" r="3" fill="#FFD37A"/><circle cx="529" cy="112" r="3" fill="#8BE8B1"/>
  <rect x="508" y="128" width="47" height="5" rx="2.5" fill="#8D77B1" opacity=".58"/>
  <rect x="566" y="128" width="70" height="5" rx="2.5" fill="#D18EFD" class="code1"/>
  <rect x="508" y="145" width="87" height="5" rx="2.5" fill="#76B9F9" class="code2"/>
  <rect x="606" y="145" width="50" height="5" rx="2.5" fill="#D18EFD" opacity=".7"/>
  <rect x="522" y="162" width="52" height="5" rx="2.5" fill="#F2A6C7" class="code3"/>
  <rect x="584" y="162" width="98" height="5" rx="2.5" fill="#8D77B1" opacity=".65"/>
  <rect x="522" y="179" width="112" height="5" rx="2.5" fill="#A4D8FF" opacity=".65"/>
  <rect x="644" y="179" width="45" height="5" rx="2.5" fill="#D18EFD" class="code1"/>
  <rect x="508" y="196" width="64" height="5" rx="2.5" fill="#F2A6C7" opacity=".75"/>
  <rect x="582" y="196" width="92" height="5" rx="2.5" fill="#8D77B1" class="code2"/>
  <rect x="522" y="213" width="78" height="5" rx="2.5" fill="#A4D8FF" class="code3"/>
  <rect x="611" y="213" width="54" height="5" rx="2.5" fill="#D18EFD" opacity=".65"/>
  <rect x="522" y="230" width="105" height="5" rx="2.5" fill="#8D77B1" opacity=".56"/>
  <rect x="638" y="230" width="33" height="5" rx="2.5" fill="#F2A6C7" class="code1"/>
  <rect x="508" y="247" width="89" height="5" rx="2.5" fill="#76B9F9" opacity=".7"/>
  <rect class="cursor" x="605" y="243" width="3" height="13" rx="1.5" fill="#F6D8FF"/>
  <path d="M606 298H642L649 329H599L606 298Z" fill="#24172F"/>
  <rect x="579" y="324" width="90" height="9" rx="4.5" fill="#2C1B37"/>

  <!-- keyboard -->
  <g transform="translate(490 320) skewX(-10)">
    <rect width="190" height="42" rx="8" fill="#15101F" stroke="#5E3B70"/>
    <g fill="#3F2B50">
      <rect x="12" y="9" width="17" height="8" rx="2"/><rect x="34" y="9" width="17" height="8" rx="2"/><rect x="56" y="9" width="17" height="8" rx="2"/><rect x="78" y="9" width="17" height="8" rx="2"/><rect x="100" y="9" width="17" height="8" rx="2"/><rect x="122" y="9" width="17" height="8" rx="2"/><rect x="144" y="9" width="17" height="8" rx="2"/>
      <rect x="18" y="22" width="17" height="8" rx="2"/><rect x="40" y="22" width="17" height="8" rx="2"/><rect x="62" y="22" width="17" height="8" rx="2"/><rect x="84" y="22" width="43" height="8" rx="2"/><rect x="132" y="22" width="17" height="8" rx="2"/><rect x="154" y="22" width="17" height="8" rx="2"/>
    </g>
  </g>

  <!-- cup -->
  <g>
    <rect x="405" y="309" width="55" height="53" rx="9" fill="#17101F" stroke="#6D4A80"/>
    <path d="M460 321h9c14 0 14 24 0 24h-9" stroke="#6D4A80" stroke-width="5"/>
    <path class="steam1" d="M420 306c-8-11 9-13 2-25" stroke="#CBA0E4" stroke-width="2" stroke-linecap="round" opacity=".5"/>
    <path class="steam2" d="M440 307c8-10-8-14 0-25" stroke="#CBA0E4" stroke-width="2" stroke-linecap="round" opacity=".45"/>
    <path d="M426 334a9 9 0 0 0 14 7 10 10 0 1 1-14-7Z" fill="#E9B3FF" opacity=".9"/>
  </g>

  <!-- cat tail behind body -->
  <path class="tail" d="M356 337C308 356 319 304 344 298C372 292 387 321 370 336C356 348 339 343 335 333" stroke="#34213E" stroke-width="24" stroke-linecap="round"/>

  <!-- cat body -->
  <ellipse cx="418" cy="304" rx="70" ry="73" fill="#2B1D34"/>
  <ellipse cx="421" cy="306" rx="51" ry="63" fill="#382442" opacity=".7"/>

  <!-- head -->
  <g>
    <path class="ear" d="M362 199L374 145L406 182Z" fill="#302039"/>
    <path d="M370 183L377 158L395 181Z" fill="#D58EB3" opacity=".55"/>
    <path d="M439 181L472 145L478 204Z" fill="#302039"/>
    <path d="M451 181L469 158L472 188Z" fill="#D58EB3" opacity=".55"/>
    <ellipse cx="419" cy="219" rx="66" ry="59" fill="#33213C"/>
    <ellipse cx="419" cy="235" rx="47" ry="33" fill="#EEE3F3"/>
    <ellipse class="eye" cx="393" cy="214" rx="9" ry="14" fill="#C9A4FF"/>
    <ellipse class="eye" cx="447" cy="214" rx="9" ry="14" fill="#C9A4FF"/>
    <circle cx="395" cy="211" r="3" fill="#FFF" opacity=".9"/><circle cx="449" cy="211" r="3" fill="#FFF" opacity=".9"/>
    <path d="M414 231L420 235L426 231" stroke="#A9688D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M420 235v6m0 0c-6 0-8 4-8 4m8-4c6 0 8 4 8 4" stroke="#8F688F" stroke-width="2" stroke-linecap="round"/>
    <path d="M381 236l-31-4m32 11l-32 5m108-12l31-4m-32 11l32 5" stroke="#BCA4C7" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- hoodie -->
  <path d="M365 283c12-28 92-30 109 4l6 51c-33 19-89 18-126-2l11-53Z" fill="#3B2050"/>
  <path d="M372 286c11 11 28 18 47 18 20 0 38-8 50-20" stroke="#6D3D86" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <circle cx="387" cy="312" r="2" fill="#E2B3FF" class="star"/>
  <path d="M451 313l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5z" fill="#E2B3FF" class="star s2"/>

  <!-- arms and paws -->
  <path d="M378 305C398 312 407 326 421 340" stroke="#3B2050" stroke-width="24" stroke-linecap="round"/>
  <path d="M463 305C447 315 440 327 433 341" stroke="#3B2050" stroke-width="24" stroke-linecap="round"/>
  <g class="paw-left"><ellipse cx="420" cy="340" rx="18" ry="12" fill="#EEE3F3"/><path d="M411 339v5m8-6v6m8-5v5" stroke="#C7AFCB" stroke-width="1.5"/></g>
  <g class="paw-right"><ellipse cx="449" cy="341" rx="18" ry="12" fill="#EEE3F3"/><path d="M440 340v5m8-6v6m8-5v5" stroke="#C7AFCB" stroke-width="1.5"/></g>

  <!-- tiny status text -->
  <g opacity=".7">
    <circle cx="80" cy="300" r="4" fill="#95E7B4"/>
    <text x="94" y="305" fill="#A891B5" font-family="Verdana, sans-serif" font-size="12" letter-spacing="1.5">currently compiling thoughts...</text>
  </g>
</svg>