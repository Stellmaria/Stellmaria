      <rect x="120" y="80" width="64" height="30" rx="10" fill="#1b172a" stroke="#4b3a61"/><text x="152" y="100" text-anchor="middle" fill="#eee4fa">Git</text>
    </g>
  </g>

  <g transform="translate(331 98)">
    <rect width="258" height="112" rx="18" fill="#141221" stroke="#382c4b"/>
