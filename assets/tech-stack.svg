<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-label="Engineering toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0a15"/><stop offset=".55" stop-color="#11101f"/><stop offset="1" stop-color="#181126"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#d8b4fe"/><stop offset=".48" stop-color="#9a83f5"/><stop offset="1" stop-color="#efa5d1"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="918" height="258" rx="26" fill="url(#bg)" stroke="#352847"/>
  <circle cx="52" cy="39" r="2" fill="#d5b4ff"/><circle cx="850" cy="40" r="1.5" fill="#efa5d1"/><circle cx="884" cy="214" r="2" fill="#8e76ca"/>
  <text x="42" y="48" fill="#f4edff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700">ENGINEERING TOOLKIT</text>
  <text x="42" y="72" fill="#8f829f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">the tools I reach for when ideas become systems</text>

  <g transform="translate(42 98)">
