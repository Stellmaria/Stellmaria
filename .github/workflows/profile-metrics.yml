name: Refresh profile metrics

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_profile_metrics.py"
      - ".github/workflows/profile-metrics.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build contribution metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Stellmaria
        run: python scripts/build_profile_metrics.py

      - name: Commit generated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-metrics-live.svg
          if git diff --cached --quiet; then
            echo "Metrics are already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh contribution metrics [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
