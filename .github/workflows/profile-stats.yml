name: Refresh profile stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_profile_stats.py"
      - ".github/workflows/profile-stats.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build profile observatory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: Stellmaria
        run: python scripts/build_profile_stats.py

      - name: Commit refreshed profile cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/contribution-observatory.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already up to date."
            exit 0
          fi
          git commit -m "chore(profile): refresh GitHub observatory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
