name: Build animated profile banner

on:
  push:
    branches: [main]
    paths:
      - "assets/lofi-master-v3/**"
      - "scripts/build_lofi_gif.py"
      - ".github/workflows/build-lofi-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build GIF
        run: python scripts/build_lofi_gif.py

      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lofi-cat-live.gif
          if git diff --cached --quiet; then
            echo "Banner is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): rebuild animated banner [skip ci]"
          git push
