name: Build static profile banner

on:
  push:
    branches: [main]
    paths:
      - "assets/lofi-master-v3/**"
      - "scripts/build_static_banner.py"
      - ".github/workflows/build-lofi-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-banner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build static hero
        run: python scripts/build_static_banner.py

      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stellmaria-banner.jpg
          if git diff --cached --quiet; then
            echo "Static banner is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): build static hero banner [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
