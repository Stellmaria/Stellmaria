name: Build animated profile banner

on:
  push:
    branches: [main]
    paths:
      - "assets/lofi-cat-final.jpg"
      - "scripts/build_lofi_gif.py"
      - ".github/workflows/build-lofi-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build GIF
        run: python scripts/build_lofi_gif.py

      - name: Switch README to animated banner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("./assets/lofi-cat-final.jpg", "./assets/lofi-cat-live.gif")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/lofi-cat-live.gif README.md
          if git diff --cached --quiet; then
            echo "Banner is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): build animated lo-fi banner"
          git push
