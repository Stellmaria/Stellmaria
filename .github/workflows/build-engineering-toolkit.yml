name: Build engineering toolkit

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_engineering_toolkit.py"
      - ".github/workflows/build-engineering-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-engineering-toolkit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build animated toolkit
        run: python scripts/build_engineering_toolkit.py

      - name: Sanitize and validate SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          path = Path("assets/engineering-toolkit-live.svg")
          svg = path.read_text(encoding="utf-8")
          svg = re.sub(
              r"&(?![A-Za-z][A-Za-z0-9]+;|#\d+;|#x[0-9A-Fa-f]+;)",
              "&amp;",
              svg,
          )
          ET.fromstring(svg)
          path.write_text(svg, encoding="utf-8")
          print("engineering-toolkit-live.svg is valid XML")
          PY

      - name: Commit generated toolkit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/engineering-toolkit-live.svg
          if git diff --cached --quiet; then
            echo "Toolkit is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): build engineering toolkit [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
