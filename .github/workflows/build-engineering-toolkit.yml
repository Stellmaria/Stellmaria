name: Build engineering toolkit

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_engineering_toolkit.py"
      - ".github/workflows/build-engineering-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-engineering-toolkit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build animated toolkit
        run: python scripts/build_engineering_toolkit.py

      - name: Validate SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("assets/engineering-toolkit-v2.svg")
          print("engineering-toolkit-v2.svg is valid XML")
          PY

      - name: Commit and publish generated toolkit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/engineering-toolkit-v2.svg
          if git diff --cached --quiet; then
            echo "Toolkit is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): build engineering toolkit [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo "Publish attempt ${attempt}/5"
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Could not publish toolkit after retries."
          exit 1
