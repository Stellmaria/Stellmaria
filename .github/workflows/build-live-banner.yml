name: Build live banner

on:
  push:
    branches: [main]
    paths:
      - "assets/stellmaria-banner-hd.png"
      - "scripts/build_live_banner.py"
      - ".github/workflows/build-live-banner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-live-banner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build live banner
        run: python scripts/build_live_banner.py

      - name: Validate SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("assets/stellmaria-banner-live.svg")
          print("stellmaria-banner-live.svg is valid XML")
          PY

      - name: Commit generated banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stellmaria-banner-live.svg
          if git diff --cached --quiet; then
            echo "Live banner is already up to date."
            exit 0
          fi
          git commit -m "chore(profile): build live banner [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
