name: Build profile motion

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_profile_motion.py"
      - ".github/workflows/build-profile-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-motion
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build motion assets
        run: python scripts/build_profile_motion.py

      - name: Commit generated motion assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/intro-live.gif assets/dev-signature-live.gif assets/afterglow-live.gif
          if git diff --cached --quiet; then
            echo "Motion assets are already up to date."
            exit 0
          fi
          git commit -m "chore(profile): build motion assets [skip ci]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying push ($attempt/5)..."
            sleep $((attempt * 2))
          done
          echo "Unable to publish motion assets after retries." >&2
          exit 1
